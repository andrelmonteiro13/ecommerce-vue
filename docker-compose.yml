version: "3.8"

services:

  uniao-app:
    image: eclipse-temurin:21-jdk

    working_dir: /app

    command: >
      sh -c "
      chmod +x mvnw &&
      ./mvnw clean package -DskipTests &&
      java -jar target/*.jar
      "

    volumes:
      - ./:/app

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_postgres:5432/uniao
      SPRING_DATASOURCE_USERNAME: uniao
      SPRING_DATASOURCE_PASSWORD: união@123456

      JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET:ytJWalrF1AkfAXJGol9cjyS6wHQ8WSUl9Tb4EDevYGnhsqNqaVbjHOoleL9eKbUm
GPpf+StueoWQc8NHKT7MPQ==

      SERVER_PORT: 8080

      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
      MINIO_BUCKET: uniao

    networks:
      - network_public

    deploy:
      labels:
        - traefik.enable=true

        - traefik.http.routers.uniao.rule=Host(`uniao.sintegro.com.br`)
        - traefik.http.routers.uniao.entrypoints=websecure
        - traefik.http.routers.uniao.tls.certresolver=letsencrypt

        - traefik.http.services.uniao.loadbalancer.server.port=8080

  minio:
    image: minio/minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123

    volumes:
      - /opt/stacks/uniao/minio:/data

    networks:
      - network_public

    deploy:
      labels:
        - traefik.enable=true

        - traefik.http.routers.minio.rule=Host(`minio-uniao.sintegro.com.br`)
        - traefik.http.routers.minio.entrypoints=websecure
        - traefik.http.routers.minio.tls.certresolver=letsencrypt

        - traefik.http.services.minio.loadbalancer.server.port=9001

networks:
  network_public:
    external: true
